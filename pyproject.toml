[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-restoration-benchmark"
version = "0.1.0"
description = "A reproducible synthetic-image denoising benchmark with calibration-only tuning and held-out evaluation."
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.3"]

[project.scripts]
restoration-bench = "restoration_benchmark.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
